---
name: Spotify Connect (patched)
version: "0.19.1"
slug: spotify
description: Play Spotify music on your Home Assistant device
url: https://github.com/0Flush0/app-spotify-connect-dev
image: ghcr.io/0flush0/spotify-connect/{arch}
arch:
  - aarch64
  - amd64
host_network: true
audio: true
init: false
options:
  name: Home Assistant
  bitrate: 160
  initial_volume: 50
  autoplay: true
  access_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  name: str
  bitrate: list(96|160|320)
  autoplay: bool
  initial_volume: match(^([0-9]|[1-9][0-9]|100)$)?
  access_token: str
